# =============================================================================
# gRPC Interop Testing Configuration (Single Source of Truth)
# Parsed using Python 3.11+ standard library `tomllib` (zero external deps).
# =============================================================================

[defaults]
default_server_port = 8080
prod_port = 443
server_host_override = "foo.test.google.fr"
docker_workdir_root = "/var/local/git/grpc"
test_timeout_seconds = 180
server_timeout_seconds = 1800
server_healthy_timeout_seconds = 600
image_build_timeout_seconds = 2700
docker_build_xml_report = "interop_docker_build/sponge_log.xml"
tests_xml_report = "interop_test/sponge_log.xml"
server_manual_cmd_log_file = "interop_server_cmds.sh"
client_manual_cmd_log_file = "interop_client_cmds.sh"
build_script = "tools/run_tests/dockerize/build_interop_image.sh"
default_service_account_key_file = "/root/service_account/grpc-testing-ebe7c1ac7381.json"
default_service_account = "830293263384-compute@developer.gserviceaccount.com"
default_oauth_scope = "https://www.googleapis.com/auth/xapi.zoo"
orca_service_config_json = '{"loadBalancingConfig":[{"test_backend_metrics_load_balancer":{}}]}'

[prod_servers]
default = "grpc-test.sandbox.googleapis.com"
gateway_v4 = "grpc-test4.sandbox.googleapis.com"

[transport_security.tls]
flags = ["--use_tls=true"]
supports_cloud_to_prod = true

[transport_security.alts]
flags = ["--use_tls=false", "--use_alts=true"]
supports_cloud_to_prod = false

[transport_security.insecure]
flags = ["--use_tls=false"]
supports_cloud_to_prod = false

[custom_credentials_types.tls]
flags = ["--use_tls=true"]

[custom_credentials_types.google_default_credentials]
flags = ["--custom_credentials_type=google_default_credentials"]

[custom_credentials_types.compute_engine_channel_creds]
flags = ["--custom_credentials_type=compute_engine_channel_creds"]

[suites]
test_cases = [
    "large_unary",
    "empty_unary",
    "ping_pong",
    "empty_stream",
    "client_streaming",
    "server_streaming",
    "cancel_after_begin",
    "cancel_after_first_response",
    "timeout_on_sleeping_server",
    "custom_metadata",
    "status_code_and_message",
    "unimplemented_method",
    "client_compressed_unary",
    "server_compressed_unary",
    "client_compressed_streaming",
    "server_compressed_streaming",
    "unimplemented_service",
    "special_status_message",
    "orca_per_rpc",
    "orca_oob",
]

cloud_to_prod_test_cases = [
    "large_unary",
    "empty_unary",
    "ping_pong",
    "empty_stream",
    "client_streaming",
    "server_streaming",
    "cancel_after_begin",
    "cancel_after_first_response",
    "timeout_on_sleeping_server",
]

auth_test_cases = [
    "compute_engine_creds",
    "jwt_token_creds",
    "oauth2_auth_token",
    "per_rpc_creds",
    "google_default_credentials",
    "compute_engine_channel_credentials",
]

http2_test_cases = [
    "tls",
    "framing",
]

http2_server_test_cases = [
    "rst_after_header",
    "rst_after_data",
    "rst_during_data",
    "goaway",
    "ping",
    "max_streams",
    "data_frame_padding",
    "no_df_padding_sanity_test",
]

orca_test_cases = [
    "orca_per_rpc",
    "orca_oob",
]

transport_security_options = ["tls", "alts", "insecure"]
custom_credentials_type_options = [
    "tls",
    "google_default_credentials",
    "compute_engine_channel_creds",
]

[suites.http2_server_grpc_client_map]
data_frame_padding = "large_unary"
no_df_padding_sanity_test = "large_unary"

# =============================================================================
# Test Case Metadata
# =============================================================================

[test_cases.compute_engine_creds]
category = "auth"
transport_security = "tls"
requires_compute_engine_creds = true
uses_key_file = false
uses_oauth_scope = true
uses_default_service_account = true

[test_cases.jwt_token_creds]
category = "auth"
transport_security = "tls"
requires_compute_engine_creds = false
uses_key_file = true
uses_oauth_scope = false
uses_default_service_account = false

[test_cases.oauth2_auth_token]
category = "auth"
transport_security = "tls"
requires_compute_engine_creds = false
uses_key_file = true
uses_oauth_scope = true
uses_default_service_account = false

[test_cases.per_rpc_creds]
category = "auth"
transport_security = "tls"
requires_compute_engine_creds = false
uses_key_file = true
uses_oauth_scope = true
uses_default_service_account = false

[test_cases.google_default_credentials]
category = "auth"
transport_security = "google_default_credentials"
requires_compute_engine_creds = false
uses_key_file = false
uses_key_file_when_flag_enabled = true
uses_oauth_scope = false
uses_default_service_account = true

[test_cases.compute_engine_channel_credentials]
category = "auth"
transport_security = "compute_engine_channel_creds"
requires_compute_engine_creds = false
uses_key_file = false
uses_oauth_scope = false
uses_default_service_account = true

